<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 06 - Galeria de Prod</title>
    <link rel="stylesheet" href="../plantilla/css/bootstrap.min.css">
</head>
<body>
    <div class="container py-4">
        <h2 class="mb-4">Catálogo de Productos</h2>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

            <div class="col">
                <div class="card h-100 text-center border">
                    <img src="https://cdn.pixabay.com/photo/2017/01/09/20/10/laptop-in-the-office-1967479_1280.jpg" class="card-img-top" alt="Laptop Gamer" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column justify-content-between p-3">
                        <h5 class="card-title">Laptop Gamer</h5>
                        <div class="mb-2">
                            <span class="badge bg-primary fs-6">S/ 4,500</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">Core i7, 16GB RAM, SSD 512GB.</p>
                        <button class="btn btn-primary btn-sm w-100 mt-2">Añadir al Carrito</button>
                    </div>
                </div>                                                                                                                                                                                          
            </div>                                                                                                          

            <div class="col">
                <div class="card h-100 text-center border-success-subtle">
                    <img src="https://cdn.pixabay.com/photo/2020/07/18/17/51/mouse-5417888_1280.jpg" class="card-img-top" alt="Mouse Inalámbrico" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Mouse Inalámbrico</h5>
                        <div class="mb-2">
                            <span class="badge bg-success fs-6">S/ 120</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">Sensor óptico de alta precisión.</p>
                        <button class="btn btn-success btn-sm w-100 mt-2">Añadir al Carrito</button>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 text-center border-warning-subtle">
                    <img src="https://cdn.pixabay.com/photo/2022/06/18/19/18/keyboard-7270529_1280.jpg" class="card-img-top" alt="Teclado Mecánico" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Teclado Mecánico</h5>
                        <div class="mb-2">
                            <span class="badge bg-warning text-dark fs-6">S/ 280</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">Switches Blue e iluminación RGB.</p>
                        <button class="btn btn-warning btn-sm w-100 mt-2">Añadir al Carrito</button>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 text-center border-danger-subtle">
                    <img src="https://cdn.pixabay.com/photo/2016/11/19/14/16/man-1839500_1280.jpg" class="card-img-top" alt="Monitor 27 4K" style="height: 180px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Monitor 27" 4K</h5>
                        <div class="mb-2">
                            <span class="badge bg-danger fs-6">S/ 1,350</span>
                        </div>
                        <p class="card-text text-muted small flex-grow-1">Panel IPS con tasa de refresco de 144Hz.</p>
                        <button class="btn btn-danger btn-sm w-100 mt-2">Añadir al Carrito</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="../plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
